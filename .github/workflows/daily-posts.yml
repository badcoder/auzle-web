name: Daily Blogspot Posts

on:
  schedule:
    - cron: '30 11 * * *'  # Runs daily at 5:00 PM IST (11:30 UTC)
  workflow_dispatch: # Manual trigger

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish daily posts to Blogger
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
        run: |
          # Refresh the access token
          RESPONSE=$(curl -s -X POST "https://oauth2.googleapis.com/token" \
            --data-urlencode "client_id=${BLOGGER_CLIENT_ID}" \
            --data-urlencode "client_secret=${BLOGGER_CLIENT_SECRET}" \
            --data-urlencode "refresh_token=${BLOGGER_REFRESH_TOKEN}" \
            --data-urlencode "grant_type=refresh_token")

          echo "Token response (redacted): $(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print({k:v for k,v in d.items() if k!='access_token' and k!='refresh_token'})" 2>/dev/null || echo "$RESPONSE")"

          ACCESS_TOKEN=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('access_token',''))" 2>/dev/null)

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ERROR: Failed to get access token. Full response:"
            echo "$RESPONSE"
            exit 1
          fi

          TODAY=$(date +%Y-%m-%d)
          EPOCH="2026-05-13"
          PUZZLE_NUM=$(( ( $(date -d "$TODAY" +%s) - $(date -d "$EPOCH" +%s) ) / 86400 + 1 ))

          BASE_URL="https://badcoder.github.io/auzle-web"

          publish_post() {
            local TITLE="$1" BODY="$2" LABELS="$3"

            local POST_JSON
            POST_JSON=$(python3 -c "
          import json, sys
          print(json.dumps({
              'kind': 'blogger#post',
              'title': sys.argv[1],
              'content': sys.argv[2],
              'labels': sys.argv[3].split(',')
          }))" "$TITLE" "$BODY" "$LABELS")

            local RESULT URL
            for ATTEMPT in 1 2 3; do
              RESULT=$(curl -s -X POST \
                "https://www.googleapis.com/blogger/v3/blogs/${BLOGGER_BLOG_ID}/posts/" \
                -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "$POST_JSON")

              URL=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('url',''))" 2>/dev/null)
              if [ -n "$URL" ]; then
                echo "Published: $URL"
                return 0
              fi

              echo "Attempt $ATTEMPT failed: $(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); e=d.get('error',{}); print(f\"[{e.get('code','?')}] {e.get('message','Unknown')}\")" 2>/dev/null || echo "$RESULT")"
              sleep 10
            done
            echo "ERROR: Failed to publish '$TITLE' after 3 attempts"
          }

          # === AURDLE POSTS (3) ===
          echo "=== Publishing Aurdle posts ==="
          for DIFF_INFO in "EASY:3:3:Easy:#2ecc71" "MEDIUM:4:4:Medium:#f39c12" "HARD:5:4:Hard:#e74c3c"; do
            IFS=':' read -r DIFF WLEN OCOUNT LABEL COLOR <<< "$DIFF_INFO"
            TITLE="🎧 Auzle.Aurdle #${PUZZLE_NUM} · ${LABEL} · ${TODAY}"
            BODY="<p>Daily audio puzzle #${PUZZLE_NUM}. Listen to patterns, match the sound, guess the word!</p><link rel=\"stylesheet\" href=\"${BASE_URL}/auzle-game.css\"><div id=\"auzle-game\"></div><script>window.AUZLE_CONFIG={difficulty:'${DIFF}',wordLen:${WLEN},optCount:${OCOUNT},label:'${LABEL}',color:'${COLOR}'};</script><script src=\"${BASE_URL}/auzle-game.js\"></script>"
            publish_post "$TITLE" "$BODY" "auzle,aurdle,audiopuzzle,wordle,${LABEL,,},puzzle-${PUZZLE_NUM}"
            sleep 10
          done

          # === AUSAW POSTS (3) ===
          echo "=== Publishing Ausaw posts ==="
          for DIFF_INFO in "Easy:9" "Medium:16" "Hard:32"; do
            IFS=':' read -r LABEL PIECES <<< "$DIFF_INFO"
            TITLE="🧩 Auzle.Ausaw #${PUZZLE_NUM} · ${LABEL} · ${TODAY}"
            BODY="<p>Daily audio jigsaw #${PUZZLE_NUM}. Listen to the melody, arrange the pieces in order!</p><div id=\"ausaw-game\" style=\"max-width:520px;margin:0 auto\"></div><script>window.AUSAW_CONFIG={difficulty:'${LABEL}'};</script><script src=\"${BASE_URL}/audio-jigsaw.js\"></script>"
            publish_post "$TITLE" "$BODY" "auzle,ausaw,audiopuzzle,jigsaw,${LABEL,,},puzzle-${PUZZLE_NUM}"
            sleep 10
          done

