<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auzle · Audio Jigsaw</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#1a1a2e;min-height:100vh;display:flex;justify-content:center;color:#fff}
#app{max-width:600px;width:100%;padding:16px}
.top-bar{text-align:center;padding:12px 0;border-bottom:1px solid #333;margin-bottom:16px}
.top-bar h1{font-size:20px;letter-spacing:1px;color:#fff}
.top-bar .tagline{font-size:12px;color:#888;margin-top:4px}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.controls select,.controls button{padding:8px 16px;border-radius:8px;border:1px solid #444;background:#2a2a3e;color:#fff;font-size:13px;cursor:pointer}
.controls button{background:#4361ee;border:none;font-weight:600}
.controls button:hover{background:#3a56d4}

/* Jigsaw Frame */
.frame-label{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:#888;margin:12px 0 8px;font-weight:600;text-align:center}
.jigsaw-frame{display:grid;gap:0;margin:0 auto 20px;padding:12px;background:#16213e;border-radius:12px;border:2px solid #4361ee}
.frame-slot{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent}
.frame-slot .slot-bg{position:absolute;inset:0;opacity:0.4}
.frame-slot .slot-label{position:relative;z-index:1;font-size:11px;color:#555;font-weight:700}
.frame-slot.filled .slot-bg{opacity:1}
.frame-slot.filled .slot-label{color:rgba(255,255,255,0.9)}
.frame-slot.highlight .slot-bg{filter:brightness(1.5)}
.frame-slot.highlight{animation:glow 0.5s ease}
.frame-slot.drop-target .slot-bg{filter:brightness(1.3)}
.frame-slot.awaiting{animation:pulse-slot 1s infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 4px rgba(255,215,0,0.3))}50%{filter:drop-shadow(0 0 12px rgba(255,215,0,0.7))}}
@keyframes pulse-slot{0%,100%{filter:drop-shadow(0 0 2px rgba(46,204,113,0.3))}50%{filter:drop-shadow(0 0 8px rgba(46,204,113,0.6))}}

/* Piece Pool */
.pool-label{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:#888;margin:12px 0 8px;font-weight:600;text-align:center}
.piece-pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 auto;padding:12px;background:#16213e;border-radius:12px;min-height:60px}
.piece{width:56px;height:56px;position:relative;cursor:pointer;transition:all .15s;user-select:none;-webkit-tap-highlight-color:transparent}
.piece:hover{transform:scale(1.1);filter:drop-shadow(0 4px 8px rgba(67,97,238,0.5))}
.piece.selected{transform:scale(1.15);filter:drop-shadow(0 0 12px rgba(255,215,0,0.7))}
.piece.playing{animation:pulse-piece 0.6s infinite}
.piece .piece-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;pointer-events:none}
@keyframes pulse-piece{0%,100%{filter:drop-shadow(0 0 4px rgba(67,97,238,0.4))}50%{filter:drop-shadow(0 0 12px rgba(67,97,238,0.8))}}

/* Dragging */
.piece.dragging{opacity:0.5;transform:scale(0.9)}
.drag-ghost{position:fixed;pointer-events:none;z-index:1000;opacity:0.85;transform:translate(-50%,-50%)}

/* Result */
.result{text-align:center;padding:16px 0;font-size:18px;font-weight:600}
.result.win{color:#2ecc71}
.stats{display:flex;justify-content:center;gap:24px;padding:8px 0;color:#aaa;font-size:13px}
.play-full-btn{display:block;margin:12px auto;padding:10px 24px;border-radius:8px;border:none;background:#2ecc71;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.play-full-btn:hover{background:#27ae60}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:100}
.toast.show{opacity:1}
.instructions{text-align:center;padding:12px 0;font-size:12px;color:#666;border-top:1px solid #222;margin-top:16px}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';

// === MELODIES ===
var MELODIES = {
  'Twinkle Twinkle': {
    bpm: 120,
    notes: [
      [262,1],[262,1],[392,1],[392,1],[440,1],[440,1],[392,2],
      [349,1],[349,1],[330,1],[330,1],[294,1],[294,1],[262,2],
      [392,1],[392,1],[349,1],[349,1],[330,1],[330,1],[294,2],
      [392,1],[392,1],[349,1],[349,1],[330,1],[330,1],[294,2],
      [262,1],[262,1],[392,1],[392,1],[440,1],[440,1],[392,2],
      [349,1],[349,1],[330,1],[330,1],[294,1],[294,1],[262,2]
    ]
  },
  'Mary Had a Little Lamb': {
    bpm: 140,
    notes: [
      [330,1],[294,1],[262,1],[294,1],[330,1],[330,1],[330,2],
      [294,1],[294,1],[294,2],[330,1],[392,1],[392,2],
      [330,1],[294,1],[262,1],[294,1],[330,1],[330,1],[330,1],[330,1],
      [294,1],[294,1],[330,1],[294,1],[262,2]
    ]
  },
  'Ode to Joy': {
    bpm: 120,
    notes: [
      [330,1],[330,1],[349,1],[392,1],[392,1],[349,1],[330,1],[294,1],
      [262,1],[262,1],[294,1],[330,1],[330,1.5],[294,0.5],[294,2],
      [330,1],[330,1],[349,1],[392,1],[392,1],[349,1],[330,1],[294,1],
      [262,1],[262,1],[294,1],[330,1],[294,1.5],[262,0.5],[262,2]
    ]
  },
  'Happy Birthday': {
    bpm: 100,
    notes: [
      [262,0.75],[262,0.25],[294,1],[262,1],[349,1],[330,2],
      [262,0.75],[262,0.25],[294,1],[262,1],[392,1],[349,2],
      [262,0.75],[262,0.25],[523,1],[440,1],[349,1],[330,1],[294,2],
      [466,0.75],[466,0.25],[440,1],[349,1],[392,1],[349,2]
    ]
  }
};

var PIECE_COUNTS = [6, 9, 12, 16, 24, 32];

// === JIGSAW SHAPE GENERATOR ===
// Each piece edge: 0=flat, 1=tab(out), -1=blank(in)
// Adjacent pieces have complementary edges (tab meets blank)
function generateEdgeMap(cols, rows, count){
  // For each internal edge, assign direction (1 or -1)
  // edgeMap[pieceIdx] = {top, right, bottom, left}
  var edges = [];
  for(var r=0; r<rows; r++){
    for(var c=0; c<cols; c++){
      var idx = r * cols + c;
      if(idx >= count) break;
      var top = 0, right = 0, bottom = 0, left = 0;
      // Top edge: flat if first row, else opposite of piece above's bottom
      if(r === 0) top = 0;
      else top = -(edges[(r-1)*cols + c].bottom);
      // Left edge: flat if first col, else opposite of piece to left's right
      if(c === 0) left = 0;
      else left = -(edges[r*cols + c - 1].right);
      // Right edge: flat if last col, else random
      if(c === cols-1) right = 0;
      else right = Math.random() > 0.5 ? 1 : -1;
      // Bottom edge: flat if last row or beyond count, else random
      if(r === rows-1 || (r+1)*cols + c >= count) bottom = 0;
      else bottom = Math.random() > 0.5 ? 1 : -1;
      edges.push({top:top, right:right, bottom:bottom, left:left});
    }
  }
  return edges;
}

// Generate SVG path for a jigsaw piece
// size = base size of piece square, tab protrudes ~20% beyond
function jigsawPath(size, edges, forClip){
  var s = size;
  var tab = s * 0.2; // tab protrusion size
  var neck = s * 0.1; // neck width
  var w = s * 0.3; // tab width at base

  // We draw path starting from top-left, going clockwise
  // Coordinate system: (0,0) is top-left of piece bounding box
  // The actual piece square occupies (tab, tab) to (tab+s, tab+s) to leave room for tabs
  var ox = tab, oy = tab; // offset
  var d = '';

  // Top edge (left to right)
  d += 'M '+ox+' '+oy+' ';
  if(edges.top === 0){
    d += 'L '+(ox+s)+' '+oy+' ';
  } else {
    var dir = edges.top; // 1=tab out (up), -1=blank in (down)
    d += 'L '+(ox+s*0.35)+' '+oy+' ';
    d += 'C '+(ox+s*0.35)+' '+(oy - dir*tab*0.1)+' '+(ox+s*0.4)+' '+(oy - dir*tab*0.8)+' '+(ox+s*0.5)+' '+(oy - dir*tab)+' ';
    d += 'C '+(ox+s*0.6)+' '+(oy - dir*tab*0.8)+' '+(ox+s*0.65)+' '+(oy - dir*tab*0.1)+' '+(ox+s*0.65)+' '+oy+' ';
    d += 'L '+(ox+s)+' '+oy+' ';
  }

  // Right edge (top to bottom)
  if(edges.right === 0){
    d += 'L '+(ox+s)+' '+(oy+s)+' ';
  } else {
    var dir = edges.right; // 1=tab out (right), -1=blank in (left)
    d += 'L '+(ox+s)+' '+(oy+s*0.35)+' ';
    d += 'C '+(ox+s + dir*tab*0.1)+' '+(oy+s*0.35)+' '+(ox+s + dir*tab*0.8)+' '+(oy+s*0.4)+' '+(ox+s + dir*tab)+' '+(oy+s*0.5)+' ';
    d += 'C '+(ox+s + dir*tab*0.8)+' '+(oy+s*0.6)+' '+(ox+s + dir*tab*0.1)+' '+(oy+s*0.65)+' '+(ox+s)+' '+(oy+s*0.65)+' ';
    d += 'L '+(ox+s)+' '+(oy+s)+' ';
  }

  // Bottom edge (right to left)
  if(edges.bottom === 0){
    d += 'L '+ox+' '+(oy+s)+' ';
  } else {
    var dir = edges.bottom; // 1=tab out (down), -1=blank in (up)
    d += 'L '+(ox+s*0.65)+' '+(oy+s)+' ';
    d += 'C '+(ox+s*0.65)+' '+(oy+s + dir*tab*0.1)+' '+(ox+s*0.6)+' '+(oy+s + dir*tab*0.8)+' '+(ox+s*0.5)+' '+(oy+s + dir*tab)+' ';
    d += 'C '+(ox+s*0.4)+' '+(oy+s + dir*tab*0.8)+' '+(ox+s*0.35)+' '+(oy+s + dir*tab*0.1)+' '+(ox+s*0.35)+' '+(oy+s)+' ';
    d += 'L '+ox+' '+(oy+s)+' ';
  }

  // Left edge (bottom to top)
  if(edges.left === 0){
    d += 'L '+ox+' '+oy+' ';
  } else {
    var dir = edges.left; // 1=tab out (left), -1=blank in (right)
    d += 'L '+ox+' '+(oy+s*0.65)+' ';
    d += 'C '+(ox - dir*tab*0.1)+' '+(oy+s*0.65)+' '+(ox - dir*tab*0.8)+' '+(oy+s*0.6)+' '+(ox - dir*tab)+' '+(oy+s*0.5)+' ';
    d += 'C '+(ox - dir*tab*0.8)+' '+(oy+s*0.4)+' '+(ox - dir*tab*0.1)+' '+(oy+s*0.35)+' '+ox+' '+(oy+s*0.35)+' ';
    d += 'L '+ox+' '+oy+' ';
  }

  d += 'Z';
  return d;
}

// Create an SVG element for a jigsaw piece
function createPieceSVG(size, edges, fillColor, strokeColor){
  var totalSize = size + size * 0.4; // room for tabs
  var svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('width', totalSize);
  svg.setAttribute('height', totalSize);
  svg.setAttribute('viewBox', '0 0 '+totalSize+' '+totalSize);
  svg.style.display = 'block';
  var path = document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d', jigsawPath(size, edges));
  path.setAttribute('fill', fillColor);
  path.setAttribute('stroke', strokeColor);
  path.setAttribute('stroke-width', '1.5');
  svg.appendChild(path);
  return svg;
}

// === AUDIO ENGINE ===
var actx = null;
function ensureAudio(){
  if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if(actx.state==='suspended') actx.resume();
}

function playNotes(notes, bpm, onNote, onDone){
  ensureAudio();
  var beatDur = 60 / bpm;
  var t = actx.currentTime + 0.02;
  var totalDur = 0;
  for(var i=0; i<notes.length; i++){
    var freq = notes[i][0], dur = notes[i][1] * beatDur;
    var osc = actx.createOscillator();
    var gain = actx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    osc.connect(gain);
    gain.connect(actx.destination);
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.3, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.01, t + dur * 0.95);
    gain.gain.linearRampToValueAtTime(0, t + dur);
    osc.start(t);
    osc.stop(t + dur);
    if(onNote){
      (function(idx, time){
        setTimeout(function(){ onNote(idx); }, (time - actx.currentTime) * 1000);
      })(i, t);
    }
    t += dur;
    totalDur = t - actx.currentTime;
  }
  if(onDone) setTimeout(onDone, totalDur * 1000 + 100);
}

// === GAME STATE ===
var state = {
  melodyName: '',
  pieceCount: 6,
  pieces: [],
  frame: [],
  pool: [],
  selectedPiece: null,
  solved: false,
  moves: 0,
  startTime: 0,
  timerStarted: false,
  isPlaying: false,
  edgeMap: [],
  cols: 3,
  rows: 2
};

// === SPLIT MELODY INTO PIECES ===
function splitMelody(notes, count){
  var pieces = [];
  var totalBeats = 0;
  for(var i=0; i<notes.length; i++) totalBeats += notes[i][1];
  var beatsPerPiece = totalBeats / count;
  var currentPiece = [];
  var currentBeats = 0;
  var pieceIdx = 0;
  for(var i=0; i<notes.length; i++){
    currentPiece.push(notes[i]);
    currentBeats += notes[i][1];
    if(currentBeats >= beatsPerPiece * (pieceIdx + 1) - 0.01 || i === notes.length - 1){
      pieces.push({id: pieceIdx, notes: currentPiece.slice(), correctIndex: pieceIdx});
      currentPiece = [];
      pieceIdx++;
      if(pieceIdx >= count - 1 && i < notes.length - 1){
        pieces.push({id: pieceIdx, notes: notes.slice(i+1), correctIndex: pieceIdx});
        break;
      }
    }
  }
  while(pieces.length < count) pieces.push({id: pieces.length, notes: [[262, 0.5]], correctIndex: pieces.length});
  return pieces.slice(0, count);
}

function shuffle(arr){
  arr = arr.slice();
  for(var i=arr.length-1; i>0; i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=arr[i]; arr[i]=arr[j]; arr[j]=t;
  }
  return arr;
}

// === RENDER ===
function ce(tag, cls){var e=document.createElement(tag);if(cls)e.className=cls;return e;}

function render(){
  var app = document.getElementById('app');
  app.innerHTML = '';

  // Top bar
  var tb = ce('div','top-bar');
  tb.innerHTML = '<h1>\uD83E\uDDE9 Auzle \u00B7 Audio Jigsaw</h1><div class="tagline">Listen \u00B7 Arrange \u00B7 Complete the melody</div>';
  app.appendChild(tb);

  // Controls
  var ctrl = ce('div','controls');
  var melSel = ce('select');
  Object.keys(MELODIES).forEach(function(name){
    var opt = ce('option'); opt.value = name; opt.textContent = name;
    if(name === state.melodyName) opt.selected = true;
    melSel.appendChild(opt);
  });
  melSel.onchange = function(){ startGame(melSel.value, state.pieceCount); };

  var pcSel = ce('select');
  PIECE_COUNTS.forEach(function(n){
    var opt = ce('option'); opt.value = n; opt.textContent = n + ' pieces';
    if(n === state.pieceCount) opt.selected = true;
    pcSel.appendChild(opt);
  });
  pcSel.onchange = function(){ startGame(state.melodyName, parseInt(pcSel.value)); };

  var newBtn = ce('button'); newBtn.textContent = '\u{1F504} New Game';
  newBtn.onclick = function(){ startGame(state.melodyName, state.pieceCount); };

  var playMelBtn = ce('button'); playMelBtn.textContent = '\u25B6 Play Melody';
  playMelBtn.onclick = function(){
    if(state.isPlaying) return;
    state.isPlaying = true;
    playMelBtn.textContent = '\u23F9 Playing...';
    playMelBtn.style.background = '#e74c3c';
    var melody = MELODIES[state.melodyName];
    playNotes(melody.notes, melody.bpm, null, function(){
      state.isPlaying = false;
      playMelBtn.textContent = '\u25B6 Play Melody';
      playMelBtn.style.background = '';
    });
  };

  ctrl.appendChild(melSel); ctrl.appendChild(pcSel); ctrl.appendChild(newBtn); ctrl.appendChild(playMelBtn);
  app.appendChild(ctrl);

  var cols = state.cols, rows = state.rows;
  // Calculate piece display size based on available width
  var maxFrameW = Math.min(480, window.innerWidth - 60);
  var pieceSize = Math.floor((maxFrameW - 24) / cols) - 2;
  pieceSize = Math.max(36, Math.min(pieceSize, 64));

  // Jigsaw Frame
  var fl = ce('div','frame-label'); fl.textContent = 'Jigsaw Frame \u2014 ' + state.melodyName;
  app.appendChild(fl);

  var frame = ce('div','jigsaw-frame');
  frame.style.gridTemplateColumns = 'repeat('+cols+', '+(pieceSize + pieceSize*0.4)+'px)';
  frame.style.gridTemplateRows = 'repeat('+rows+', '+(pieceSize + pieceSize*0.4)+'px)';
  frame.style.width = 'fit-content';

  for(var i=0; i<state.pieceCount; i++){
    (function(slotIdx){
      var slot = ce('div','frame-slot');
      slot.style.width = (pieceSize + pieceSize*0.4) + 'px';
      slot.style.height = (pieceSize + pieceSize*0.4) + 'px';

      var edges = state.edgeMap[slotIdx] || {top:0,right:0,bottom:0,left:0};

      if(state.frame[slotIdx] !== null){
        slot.classList.add('filled');
        var svg = createPieceSVG(pieceSize, edges, '#4361ee', '#5a7afe');
        svg.classList.add('slot-bg');
        svg.style.position = 'absolute';
        svg.style.inset = '0';
        slot.appendChild(svg);
        var lbl = ce('span','slot-label'); lbl.textContent = '\uD83C\uDFB5';
        slot.appendChild(lbl);
        slot.onclick = function(){
          if(state.solved || state.isPlaying) return;
          playPieceAudio(state.frame[slotIdx]);
        };
      } else {
        // Empty slot - show outline shape
        var svg = createPieceSVG(pieceSize, edges, 'rgba(15,52,96,0.6)', '#333');
        svg.classList.add('slot-bg');
        svg.style.position = 'absolute';
        svg.style.inset = '0';
        slot.appendChild(svg);
        var lbl = ce('span','slot-label'); lbl.textContent = (slotIdx + 1);
        slot.appendChild(lbl);

        // Highlight if a piece is selected (awaiting placement)
        if(state.selectedPiece !== null){
          slot.classList.add('awaiting');
        }

        slot.onclick = function(){
          if(state.solved || state.isPlaying) return;
          if(state.selectedPiece !== null){
            placePiece(slotIdx);
          }
        };

        // Drop target for drag
        slot.ondragover = function(e){ e.preventDefault(); slot.classList.add('drop-target'); };
        slot.ondragleave = function(){ slot.classList.remove('drop-target'); };
        slot.ondrop = function(e){
          e.preventDefault();
          slot.classList.remove('drop-target');
          var pieceId = parseInt(e.dataTransfer.getData('text/plain'));
          if(!isNaN(pieceId)){
            state.selectedPiece = pieceId;
            placePiece(slotIdx);
          }
        };
      }
      slot.dataset.slot = slotIdx;
      frame.appendChild(slot);
    })(i);
  }
  app.appendChild(frame);

  // Piece Pool
  if(state.pool.length > 0 && !state.solved){
    var pl = ce('div','pool-label');
    if(state.selectedPiece !== null){
      pl.textContent = '\u261D Piece selected! Tap an empty slot above to place it.';
      pl.style.color = '#ffd700';
    } else {
      pl.textContent = 'Pieces (' + state.pool.length + ' remaining) \u2014 tap to listen & select';
    }
    app.appendChild(pl);

    var pool = ce('div','piece-pool');

    state.pool.forEach(function(pieceId){
      var piece = ce('div','piece');
      var edges = state.edgeMap[pieceId] || {top:0,right:0,bottom:0,left:0};

      if(state.selectedPiece === pieceId) piece.classList.add('selected');

      // Render jigsaw shape
      var svg = createPieceSVG(40, edges, state.selectedPiece===pieceId ? '#ffd700' : '#4361ee', state.selectedPiece===pieceId ? '#ffed4a' : '#5a7afe');
      piece.appendChild(svg);
      var lbl = ce('div','piece-label'); lbl.textContent = '\uD83C\uDFB5';
      piece.appendChild(lbl);

      // Draggable
      piece.draggable = true;
      piece.ondragstart = function(e){
        e.dataTransfer.setData('text/plain', pieceId.toString());
        piece.classList.add('dragging');
        state.selectedPiece = pieceId;
        // Highlight all empty slots
        setTimeout(function(){
          document.querySelectorAll('.frame-slot:not(.filled)').forEach(function(s){ s.classList.add('awaiting'); });
        }, 50);
      };
      piece.ondragend = function(){
        piece.classList.remove('dragging');
        document.querySelectorAll('.frame-slot').forEach(function(s){ s.classList.remove('awaiting','drop-target'); });
      };

      // Click to select/deselect + play audio
      piece.onclick = function(e){
        e.stopPropagation();
        if(state.isPlaying) return;
        if(state.selectedPiece === pieceId){
          // Deselect
          state.selectedPiece = null;
          render();
        } else {
          state.selectedPiece = pieceId;
          render();
          playPieceAudio(pieceId);
        }
      };

      // Touch drag support for mobile
      var touchData = null;
      piece.ontouchstart = function(e){
        touchData = {id: pieceId, startX: e.touches[0].clientX, startY: e.touches[0].clientY, moved: false};
        state.selectedPiece = pieceId;
      };
      piece.ontouchmove = function(e){
        if(!touchData) return;
        var dx = e.touches[0].clientX - touchData.startX;
        var dy = e.touches[0].clientY - touchData.startY;
        if(Math.abs(dx) > 10 || Math.abs(dy) > 10) touchData.moved = true;
      };
      piece.ontouchend = function(e){
        if(!touchData) return;
        if(!touchData.moved){
          // Just a tap - select and play
          if(state.isPlaying){ touchData = null; return; }
          render();
          playPieceAudio(pieceId);
        } else {
          // Was a drag - find slot under finger
          var touch = e.changedTouches[0];
          var el = document.elementFromPoint(touch.clientX, touch.clientY);
          if(el){
            var slot = el.closest('.frame-slot');
            if(slot && !slot.classList.contains('filled')){
              var slotIdx = parseInt(slot.dataset.slot);
              placePiece(slotIdx);
            }
          }
        }
        touchData = null;
      };

      pool.appendChild(piece);
    });
    app.appendChild(pool);
  }

  // Result
  if(state.solved){
    var rd = ce('div','result win');
    var elapsed = Math.floor((Date.now() - state.startTime)/1000);
    rd.innerHTML = '\u2705 Melody Complete!<div class="stats"><span>\u23F1 '+Math.floor(elapsed/60)+':'+String(elapsed%60).padStart(2,'0')+'</span><span>\uD83D\uDD00 '+state.moves+' moves</span></div>';
    app.appendChild(rd);

    var playBtn = ce('button','play-full-btn');
    playBtn.textContent = '\u25B6 Play Full Melody';
    playBtn.onclick = function(){ playFullMelody(); };
    app.appendChild(playBtn);
  }

  // Instructions
  var ins = ce('div','instructions');
  ins.textContent = 'Tap a piece to hear it, then tap a slot to place. Or drag pieces into the frame. Pieces only fit in their correct position!';
  app.appendChild(ins);

  // Toast
  if(!document.getElementById('toast-el')){
    var toastEl = ce('div','toast');
    toastEl.id = 'toast-el';
    document.body.appendChild(toastEl);
  }
}

function toast(msg){
  var el = document.getElementById('toast-el');
  if(!el) return;
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function(){ el.classList.remove('show'); }, 2000);
}

function playPieceAudio(pieceId){
  if(state.isPlaying) return;
  var piece = state.pieces[pieceId];
  if(!piece || piece.notes.length === 0) return;
  state.isPlaying = true;
  if(!state.timerStarted){
    state.timerStarted = true;
    state.startTime = Date.now();
  }
  playNotes(piece.notes, MELODIES[state.melodyName].bpm, null, function(){
    state.isPlaying = false;
  });
}

function placePiece(slotIdx){
  if(state.selectedPiece === null) return;
  if(state.frame[slotIdx] !== null){
    toast('Slot already filled!');
    return;
  }
  state.moves++;
  var pieceId = state.selectedPiece;
  var piece = state.pieces[pieceId];

  if(piece.correctIndex === slotIdx){
    state.frame[slotIdx] = pieceId;
    state.pool = state.pool.filter(function(id){ return id !== pieceId; });
    state.selectedPiece = null;
    if(state.pool.length === 0){
      state.solved = true;
    }
    render();
    if(state.solved){
      setTimeout(function(){ playFullMelody(); }, 500);
    } else {
      toast('\u2705 Correct!');
    }
  } else {
    toast('\u274C Wrong slot! Listen again.');
    state.selectedPiece = null;
    render();
  }
}

function playFullMelody(){
  if(state.isPlaying) return;
  state.isPlaying = true;
  var melody = MELODIES[state.melodyName];
  var allNotes = melody.notes;

  var noteTopiece = [];
  for(var p=0; p<state.pieces.length; p++){
    for(var n=0; n<state.pieces[p].notes.length; n++){
      noteTopiece.push(p);
    }
  }

  var slots = document.querySelectorAll('.frame-slot');
  playNotes(allNotes, melody.bpm, function(idx){
    var pieceId = noteTopiece[idx];
    if(pieceId !== undefined){
      slots.forEach(function(s){ s.classList.remove('highlight'); });
      for(var i=0; i<state.frame.length; i++){
        if(state.frame[i] === pieceId){
          if(slots[i]) slots[i].classList.add('highlight');
          break;
        }
      }
    }
  }, function(){
    state.isPlaying = false;
    document.querySelectorAll('.frame-slot').forEach(function(s){ s.classList.remove('highlight'); });
  });
}

function startGame(melodyName, pieceCount){
  var melody = MELODIES[melodyName];
  if(!melody) melodyName = Object.keys(MELODIES)[0];
  melody = MELODIES[melodyName];

  var cols = Math.ceil(Math.sqrt(pieceCount));
  var rows = Math.ceil(pieceCount / cols);

  state.melodyName = melodyName;
  state.pieceCount = pieceCount;
  state.pieces = splitMelody(melody.notes, pieceCount);
  state.frame = new Array(pieceCount).fill(null);
  state.pool = shuffle(state.pieces.map(function(p){ return p.id; }));
  state.selectedPiece = null;
  state.solved = false;
  state.moves = 0;
  state.startTime = 0;
  state.timerStarted = false;
  state.isPlaying = false;
  state.cols = cols;
  state.rows = rows;
  state.edgeMap = generateEdgeMap(cols, rows, pieceCount);
  render();
}

// Init
startGame('Twinkle Twinkle', 6);

})();
</script>
